<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --emerald-950:#0E241D;
    --emerald-900:#123329;
    --emerald-800:#1B4436;
    --emerald-700:#245544;
    --brass-500:#C6A15B;
    --brass-400:#D4B575;
    --brass-300:#E3CD9A;
    --brass-200:#EFDFB8;
    --ivory-50:#FBF7EF;
    --ivory-100:#F3ECDD;
    --ink-900:#221D18;
    --ink-700:#4A423A;
    --ink-500:#746A5E;
    --clay-500:#B9694C;
    --clay-400:#C97D5F;
    --sage-100:#E9ECDD;
    --white:#FFFFFF;
    --shadow-soft: 0 20px 50px -20px rgba(14,36,29,0.35);
    --shadow-card: 0 10px 30px -12px rgba(34,29,24,0.18);
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --max: 1180px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Manrope', sans-serif;
    color:var(--ink-900);
    background:var(--ivory-50);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  ul{margin:0; padding:0; list-style:none;}
  button{font-family:inherit; cursor:pointer;}
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    margin:0;
    color:var(--emerald-950);
    letter-spacing:-0.01em;
  }
  .container{
    max-width:var(--max);
    margin:0 auto;
    padding:0 24px;
  }
  section{padding:96px 0;}
  @media(max-width:768px){ section{padding:64px 0;} }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--clay-500);
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:"";
    width:26px;
    height:1.5px;
    background:var(--clay-500);
    display:inline-block;
  }
  .section-head{
    max-width:640px;
    margin-bottom:52px;
  }
  .section-head h2{
    font-size:clamp(30px,4vw,44px);
    line-height:1.12;
    font-weight:600;
  }
  .section-head p{
    margin-top:16px;
    color:var(--ink-700);
    font-size:16.5px;
    line-height:1.65;
  }
  .center{ text-align:center; margin-left:auto; margin-right:auto; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:16px 30px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    border:1.5px solid transparent;
    transition:transform .35s cubic-bezier(.2,.7,.3,1), box-shadow .35s ease, background .3s ease, color .3s ease, border-color .3s ease;
    white-space:nowrap;
    position:relative;
  }
  .btn svg{ width:18px; height:18px; flex-shrink:0; }
  .btn-primary{
    background:linear-gradient(100deg, var(--brass-400), var(--brass-500) 55%, var(--brass-400));
    color:var(--emerald-950);
    box-shadow:0 14px 30px -10px rgba(198,161,91,0.55);
    overflow:hidden;
  }
  .btn-primary::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.65), transparent);
    transform:skewX(-20deg);
    animation:sweep 4.5s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{ left:-60%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }
  .btn-primary:hover{ transform:translateY(-3px); box-shadow:0 20px 36px -12px rgba(198,161,91,0.65); }

  .btn-outline-light{
    border-color:rgba(243,236,221,0.45);
    color:var(--ivory-100);
    background:rgba(255,255,255,0.04);
  }
  .btn-outline-light:hover{ background:rgba(255,255,255,0.12); transform:translateY(-3px); }

  .btn-outline-dark{
    border-color:rgba(34,29,24,0.2);
    color:var(--emerald-950);
    background:transparent;
  }
  .btn-outline-dark:hover{ background:var(--emerald-950); color:var(--ivory-50); transform:translateY(-3px); }

  .btn-whatsapp{
    background:#1F4436;
    color:var(--ivory-50);
    box-shadow:0 14px 26px -12px rgba(31,68,54,0.55);
  }
  .btn-whatsapp:hover{ transform:translateY(-3px); background:#245544; }

  .btn-sm{ padding:12px 22px; font-size:13.5px; }
  .btn-block{ width:100%; }

  /* ---------- Reveal on scroll ---------- */
  .reveal{
    opacity:0;
    transform:translateY(26px);
    transition:opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }
  .reveal-stagger > *{ transition-delay:calc(var(--i, 0) * 90ms); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .reveal{ opacity:1; transform:none; transition:none; }
    .btn-primary::after{ animation:none; display:none; }
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  /* ---------- Navbar ---------- */
  .nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    padding:20px 0;
    transition:padding .35s ease, background .35s ease, box-shadow .35s ease;
  }
  .nav-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .nav.scrolled{
    padding:12px 0;
    background:rgba(14,36,29,0.86);
    backdrop-filter:blur(14px);
    box-shadow:0 10px 30px -18px rgba(0,0,0,0.6);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    color:var(--ivory-50);
  }
  .brand-mark{
    width:40px; height:40px;
    border-radius:50%;
    background:linear-gradient(140deg, var(--brass-300), var(--brass-500));
    display:flex; align-items:center; justify-content:center;
    color:var(--emerald-950);
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:18px;
    flex-shrink:0;
    box-shadow:0 6px 16px -6px rgba(198,161,91,0.7);
  }
  .brand small{
    display:block;
    font-family:'Manrope', sans-serif;
    font-weight:600;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass-300);
    margin-top:2px;
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap:34px;
  }
  .nav-links a{
    color:rgba(251,247,239,0.82);
    font-size:14.5px;
    font-weight:600;
    position:relative;
    padding:4px 0;
    transition:color .25s ease;
  }
  .nav-links a::after{
    content:"";
    position:absolute;
    left:0; bottom:-2px;
    width:0; height:1.5px;
    background:var(--brass-400);
    transition:width .3s ease;
  }
  .nav-links a:hover{ color:var(--ivory-50); }
  .nav-links a:hover::after{ width:100%; }
  .nav-cta{ display:flex; align-items:center; gap:14px; }
  .nav-toggle{
    display:none;
    background:none; border:none;
    width:40px; height:40px;
    align-items:center; justify-content:center;
    color:var(--ivory-50);
  }
  .nav-toggle svg{ width:24px; height:24px; }

  .mobile-panel{
    position:fixed;
    inset:0;
    z-index:99;
    background:var(--emerald-950);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    transform:translateY(-100%);
    transition:transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .mobile-panel.open{ transform:translateY(0); }
  .mobile-panel a{
    font-family:'Fraunces', serif;
    font-size:26px;
    color:var(--ivory-100);
  }

  @media(max-width:920px){
    .nav-links{ display:none; }
    .nav-toggle{ display:flex; }
    .nav-cta .btn-outline-light{ display:none; }
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    background:
      radial-gradient(circle at 18% 18%, rgba(198,161,91,0.18), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(185,105,76,0.16), transparent 50%),
      linear-gradient(160deg, var(--emerald-950), var(--emerald-900) 60%, #0A1D17);
    overflow:hidden;
    padding-top:120px;
    padding-bottom:80px;
  }
  .sparkle{
    position:absolute;
    border-radius:50%;
    background:var(--brass-300);
    opacity:0;
    animation:twinkle 3.6s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0; transform:scale(0.4); }
    50%{ opacity:0.9; transform:scale(1); }
  }
  .hero-grid{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:60px;
    align-items:center;
  }
  @media(max-width:980px){
    .hero-grid{ grid-template-columns:1fr; }
  }
  .hero-frame{
    border:1px solid rgba(212,181,117,0.35);
    border-radius:var(--radius-lg);
    padding:52px 48px;
    background:rgba(251,247,239,0.03);
    backdrop-filter:blur(2px);
  }
  @media(max-width:640px){ .hero-frame{ padding:34px 24px; } }

  .hero-frame h1{
    font-size:clamp(38px,6.4vw,68px);
    line-height:1.04;
    font-weight:600;
    color:var(--ivory-50);
    font-style:italic;
  }
  .hero-frame h1 span{
    display:block;
    font-style:normal;
    font-weight:400;
    font-size:0.42em;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--brass-300);
    margin-bottom:14px;
    font-family:'Manrope', sans-serif;
  }
  .hero-tagline{
    margin-top:22px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(19px,2.4vw,24px);
    color:var(--brass-200);
  }
  .hero-sub{
    margin-top:18px;
    max-width:480px;
    color:rgba(251,247,239,0.78);
    font-size:16px;
    line-height:1.7;
  }
  .hero-cta-row{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    margin-top:36px;
  }
  .hero-pin{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:34px;
    color:rgba(251,247,239,0.68);
    font-size:13.5px;
  }
  .hero-pin svg{ width:16px; height:16px; color:var(--brass-400); flex-shrink:0; }

  .hero-visual{
    position:relative;
    aspect-ratio:4/5;
    border-radius:var(--radius-lg);
    background:
      linear-gradient(155deg, rgba(212,181,117,0.35), rgba(185,105,76,0.25)),
      linear-gradient(200deg, var(--emerald-800), var(--emerald-900));
    border:1px solid rgba(212,181,117,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .hero-visual .glyph{
    width:44%;
    color:rgba(251,247,239,0.85);
    opacity:0.9;
  }
  .hero-visual-caption{
    position:absolute;
    bottom:22px; left:22px; right:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    color:var(--brass-200);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-weight:700;
  }

  /* ---------- About ---------- */
  .about{ background:var(--ivory-50); }
  .about-grid{
    display:grid;
    grid-template-columns:0.9fr 1.1fr;
    gap:64px;
    align-items:center;
  }
  @media(max-width:900px){ .about-grid{ grid-template-columns:1fr; gap:36px; } }
  .about-panel{
    border-radius:var(--radius-lg);
    aspect-ratio:1/1.05;
    background:linear-gradient(160deg, var(--emerald-800), var(--emerald-950));
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--shadow-soft);
  }
  .about-panel .glyph{ width:38%; color:var(--brass-300); }
  .about-copy p{
    color:var(--ink-700);
    font-size:16.5px;
    line-height:1.75;
    margin:0 0 18px;
  }
  .about-points{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    margin-top:28px;
  }
  @media(max-width:520px){ .about-points{ grid-template-columns:1fr; } }
  .about-point{
    display:flex;
    gap:12px;
    padding:16px;
    background:var(--white);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);
  }
  .about-point svg{ width:22px; height:22px; color:var(--clay-500); flex-shrink:0; }
  .about-point div strong{ display:block; font-size:14.5px; color:var(--emerald-950); margin-bottom:3px; }
  .about-point div span{ font-size:13px; color:var(--ink-500); line-height:1.5; }

  /* ---------- Services ---------- */
  .services{ background:var(--ivory-100); }
  .service-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:26px;
  }
  @media(max-width:900px){ .service-grid{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:600px){ .service-grid{ grid-template-columns:1fr; } }
  .service-card{
    background:var(--white);
    border-radius:var(--radius-md);
    padding:32px 28px;
    box-shadow:var(--shadow-card);
    transition:transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s ease;
  }
  .service-card:hover{ transform:translateY(-8px); box-shadow:0 24px 40px -18px rgba(34,29,24,0.28); }
  .service-icon{
    width:54px; height:54px;
    border-radius:50%;
    background:linear-gradient(150deg, var(--sage-100), var(--ivory-100));
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
  }
  .service-icon svg{ width:26px; height:26px; color:var(--clay-500); }
  .service-card h3{ font-size:19px; font-weight:600; margin-bottom:10px; }
  .service-card p{ font-size:14.5px; color:var(--ink-700); line-height:1.65; margin:0; }

  /* ---------- Pricing ---------- */
  .pricing{ background:var(--emerald-950); position:relative; overflow:hidden; }
  .pricing::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 85% 10%, rgba(198,161,91,0.14), transparent 45%);
  }
  .pricing .section-head h2{ color:var(--ivory-50); }
  .pricing .section-head p{ color:rgba(251,247,239,0.68); }
  .pricing .eyebrow{ color:var(--brass-300); }
  .pricing .eyebrow::before{ background:var(--brass-300); }
  .price-note{
    position:relative;
    z-index:1;
    color:var(--brass-200);
    font-size:13.5px;
    background:rgba(212,181,117,0.1);
    border:1px solid rgba(212,181,117,0.3);
    padding:12px 18px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-bottom:40px;
  }
  .price-note svg{ width:16px; height:16px; flex-shrink:0; }
  .price-grid{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:24px;
  }
  @media(max-width:800px){ .price-grid{ grid-template-columns:1fr; } }
  .price-card{
    background:rgba(251,247,239,0.04);
    border:1px solid rgba(212,181,117,0.22);
    border-radius:var(--radius-md);
    padding:30px 30px 8px;
  }
  .price-card h3{
    color:var(--brass-300);
    font-size:17px;
    font-weight:600;
    padding-bottom:16px;
    margin-bottom:12px;
    border-bottom:1px solid rgba(212,181,117,0.22);
  }
  .price-row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:13px 0;
    border-bottom:1px dashed rgba(251,247,239,0.14);
    color:rgba(251,247,239,0.88);
    font-size:14.5px;
  }
  .price-row:last-child{ border-bottom:none; }
  .price-row span:first-child{ color:rgba(251,247,239,0.92); font-weight:500; }
  .price-row span:last-child{ color:var(--brass-300); font-weight:700; white-space:nowrap; }

  /* ---------- Gallery ---------- */
  .gallery{ background:var(--ivory-50); }
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-auto-rows:150px;
    gap:16px;
  }
  @media(max-width:900px){ .gallery-grid{ grid-template-columns:repeat(3,1fr); grid-auto-rows:130px; } }
  @media(max-width:600px){ .gallery-grid{ grid-template-columns:repeat(2,1fr); grid-auto-rows:120px; } }
  .gallery-tile{
    border-radius:16px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    padding:14px;
    color:var(--ivory-50);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .gallery-tile svg{
    position:absolute;
    top:16px; left:16px;
    width:20px; height:20px;
    color:rgba(251,247,239,0.75);
  }
  .gallery-tile::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(14,36,29,0.55), transparent 60%);
  }
  .gallery-tile span{ position:relative; z-index:1; }
  .gallery-tile.g1{ grid-column:span 2; grid-row:span 2; background:linear-gradient(150deg,#1B4436,#0E241D); }
  .gallery-tile.g2{ background:linear-gradient(150deg,#C6A15B,#8C6C33); }
  .gallery-tile.g3{ background:linear-gradient(150deg,#B9694C,#7A4530); }
  .gallery-tile.g4{ background:linear-gradient(150deg,#245544,#123329); }
  .gallery-tile.g5{ grid-column:span 2; background:linear-gradient(150deg,#D4B575,#B9694C); }
  .gallery-tile.g6{ background:linear-gradient(150deg,#1F4436,#0A1D17); }
  .gallery-tile.g7{ background:linear-gradient(150deg,#C97D5F,#8C6C33); }

  /* ---------- Reviews ---------- */
  .reviews{ background:var(--sage-100); }
  .review-note{
    color:var(--ink-700);
    font-size:14.5px;
    margin-top:-30px;
    margin-bottom:44px;
    max-width:600px;
  }
  .review-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:24px;
  }
  @media(max-width:900px){ .review-grid{ grid-template-columns:1fr; } }
  .review-card{
    background:var(--white);
    border-radius:var(--radius-md);
    padding:30px;
    box-shadow:var(--shadow-card);
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .stars{ display:flex; gap:4px; color:var(--brass-500); }
  .stars svg{ width:17px; height:17px; }
  .review-card p{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:16px;
    color:var(--ink-700);
    line-height:1.6;
    margin:0;
    flex-grow:1;
  }
  .review-who{
    display:flex; align-items:center; gap:12px;
    padding-top:14px;
    border-top:1px solid var(--ivory-100);
  }
  .review-avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--sage-100);
    display:flex; align-items:center; justify-content:center;
    color:var(--emerald-800);
    flex-shrink:0;
  }
  .review-avatar svg{ width:18px; height:18px; }
